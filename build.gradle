plugins {
    id 'java'
    id('xyz.jpenilla.run-paper') version '2.3.1'
    id('com.gradleup.shadow') version '8.3.6'
}

group = 'ru.exiledproject.developments'
version = '1.9.5'

base {
    archivesName = 'eSCore'
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'placeholderapi'
        url = 'https://repo.helpch.at/releases'
    }
}

dependencies {
    implementation project(':escore-api')
    implementation project(':escore-storage')
    implementation project(':escore-scripting-js')
    compileOnly('io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT')
    compileOnly('net.luckperms:api:5.4')

    // Runtime libraries loaded by Paper from plugin.yml.
    implementation('com.google.code.gson:gson:2.11.0')
    implementation('org.xerial:sqlite-jdbc:3.51.3.0')
    implementation('com.mysql:mysql-connector-j:9.6.0')
    implementation('redis.clients:jedis:6.2.0')

    testImplementation(platform('org.junit:junit-bom:5.13.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

sourceSets {
    main {
        java {
            exclude 'ru/exiledproject/developments/api/**'
            exclude 'ru/exiledproject/developments/data/ChangeOrigin.java'
            exclude 'ru/exiledproject/developments/data/PersistedValue.java'
            exclude 'ru/exiledproject/developments/storage/StorageBackend.java'
            exclude 'ru/exiledproject/developments/storage/StorageWrite.java'
        }
    }
}

jar {
    enabled = false
}

shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()

    dependencies {
        include(dependency('ru.exiledproject.developments:escore-api:.*'))
        include(dependency('ru.exiledproject.developments:escore-storage:.*'))
        include(dependency('ru.exiledproject.developments:escore-scripting-js:.*'))
        include(dependency('org.graalvm.polyglot:.*'))
        include(dependency('org.graalvm.js:.*'))
        include(dependency('org.graalvm.truffle:.*'))
        include(dependency('org.graalvm.sdk:.*'))
        include(dependency('org.graalvm.regex:.*'))
        include(dependency('org.graalvm.shadowed:.*'))
    }
}

assemble {
    dependsOn shadowJar
}

tasks {
    runServer {
        minecraftVersion('1.21.8')
    }
}

def targetJavaVersion = 21
java {
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation']

    // Compile against the Java 21 API even when Gradle itself runs on a newer JDK.
    options.release.set(targetJavaVersion)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
