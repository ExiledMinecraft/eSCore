plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

repositories {
    mavenCentral()
    maven {
        name = 'papermc-repo'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnlyApi 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
}

sourceSets {
    main {
        java {
            srcDir rootProject.file('src/main/java')
            include 'ru/exiledproject/developments/api/**'
            include 'ru/exiledproject/developments/data/ChangeOrigin.java'
        }
    }
}

def targetJavaVersion = 21
java {
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}
