plugins {
    id 'java-library'
}

group = rootProject.group
version = rootProject.version

sourceSets {
    main {
        java {
            srcDir rootProject.file('src/main/java')
            include 'ru/exiledproject/developments/data/PersistedValue.java'
            include 'ru/exiledproject/developments/storage/StorageBackend.java'
            include 'ru/exiledproject/developments/storage/StorageWrite.java'
        }
    }
}

def targetJavaVersion = 21
java {
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}
